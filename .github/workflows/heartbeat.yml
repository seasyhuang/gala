name: Weekly still-watching ping

on:
  schedule:
    # Sundays 15:00 UTC ≈ 11:00 ET (EDT) / 10:00 ET (EST)
    - cron: "0 15 * * 0"
  workflow_dispatch:

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Send heartbeat
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 check.py --heartbeat
